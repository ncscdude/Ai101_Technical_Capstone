name: Canonicalizer CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate evidence
        run: python scripts/generate_evidence.py

      - name: Commit updated evidence
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evidence/test_results.txt
          git diff --cached --quiet || git commit -m "ci: regenerate evidence/test_results.txt [skip ci]"
          git push
